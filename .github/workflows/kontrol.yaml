name: Kontrol

# Unbounded proofs over the repo-token and auction list libraries.
#
# The suite, its configuration and its 22KB lemma file have been in the tree
# since May and have never run: ci.yaml executes
# `forge test --no-match-path "src/test/kontrol/*"`, so the only automation
# touching these proofs is the flag that skips them.
#
# They are slow (K's reachability engine, not a per-assertion SMT query), so
# this is deliberately NOT a pull-request gate. It runs nightly and on demand.
# Making it block PRs is what caused the exclusion in the first place.

on:
  schedule:
    # 04:00 UTC, off the working day.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      config-profile:
        description: "kontrol.toml prove profile to run"
        type: choice
        options: [tests, setup]
        default: tests
  push:
    # Changes to the proofs themselves, their lemmas, or the code they cover
    # should be checked before they are a night old.
    paths:
      - "src/RepoTokenList.sol"
      - "src/TermAuctionList.sol"
      - "src/test/kontrol/**"
      - "kontrol.toml"
      - ".github/workflows/kontrol.yaml"

permissions:
  contents: read

concurrency:
  group: kontrol-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  proofs:
    runs-on: ubuntu-latest
    # Proofs run for hours. The default 360-minute ceiling would cancel a run
    # that was still making progress and report it as a failure.
    timeout-minutes: 360
    container:
      # Pinned, not floating: a Kontrol upgrade can change what the lemmas
      # discharge, and that should be a reviewed commit rather than a surprise
      # in a nightly run.
      image: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.255
      options: --user root
    env:
      # The image keeps everything Kontrol needs under its own user's home: the
      # Python package (a pip user-site install, /home/user/.local) AND the
      # pre-built K definitions (/home/user/.cache/kdist-*/kontrol/base).
      # GitHub sets HOME=/github/home on container jobs, which hides both --
      # the first surfaced as `ModuleNotFoundError: kontrol`, the second as
      # `Target undefined or not built: kontrol.base`. Restoring HOME fixes the
      # cause rather than chasing each path; it was reproduced and confirmed
      # locally with `podman run --user root -e HOME=/github/home`.
      HOME: /home/user
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Kontrol version
        run: kontrol version

      # `kontrol build` reads [build.default] from kontrol.toml, which requires
      # src/test/kontrol/term-lemmas.k and imports it into the test module.
      - name: Build
        run: kontrol build --config-profile default

      # The setUp profile proves the fixtures the test profile assumes. It is a
      # prerequisite, not an optional extra: proving the tests against an
      # unproven setUp would assume the state the proofs are about.
      - name: Prove setUp
        run: kontrol prove --config-profile setup --workers 4

      # Bounded inside the step, well under the job's 360 minutes. Reaching the
      # job ceiling cancels whatever is running and leaves no summary; stopping
      # here keeps ~30 minutes for the steps below (checkout, build and setUp
      # take ~27). `timeout` signals its whole process group, which includes the
      # kore-rpc-booster servers kontrol spawns, so none outlive the prover.
      # Proofs cut short stay PENDING in the summary; they are not failures.
      - name: Prove tests
        run: |
          set +e
          timeout --signal=INT --kill-after=2m 300m \
            kontrol prove --config-profile ${{ inputs.config-profile || 'tests' }} --workers 4
          rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=Kontrol time budget::kontrol prove was stopped at 300 minutes before every proof finished. See 'Summarize proofs' for per-proof status."
          fi
          exit "$rc"

      # `kontrol prove` prints failure reasons and counterexample models only when
      # the whole run completes, and proof.json does not store them. Recompute
      # them against the definition this job kompiled, so a failed proof can be
      # diagnosed even when the run was cut short.
      - name: Summarize proofs
        if: always()
        run: |
          mkdir -p kontrol-report
          if [ ! -d out/proofs ]; then
            echo "No proofs were written."
            exit 0
          fi
          kontrol list 2>&1 | tee kontrol-report/list.txt
          awk '/^APRProof: /{id=$2} /^ +status: ProofStatus.FAILED$/{print id}' \
            kontrol-report/list.txt > kontrol-report/failed.txt
          while read -r id; do
            report="kontrol-report/failure-$(printf '%s' "$id" | tr -c 'A-Za-z0-9._-' '_').txt"
            kontrol show --version "${id##*:}" --failure-information --counterexample-information \
              "${id%:*}" > "$report" 2>&1 || true
            echo "::group::Failure information: $id"
            cat "$report"
            echo "::endgroup::"
          done < kontrol-report/failed.txt

      # Kontrol names each proof directory after the test signature plus a `:N`
      # version suffix, and upload-artifact rejects `:` in paths. A tarball keeps
      # the names intact.
      - name: Package proof artifacts
        if: always()
        run: |
          mkdir -p kontrol-report
          if [ -d out/proofs ]; then
            tar -czf kontrol-report/proofs.tar.gz out/proofs
          fi

      # The proof artifacts are what a failure is diagnosed from; without them a
      # red run says only "something did not prove".
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kontrol-proofs
          path: kontrol-report/
          retention-days: 14
          if-no-files-found: warn
