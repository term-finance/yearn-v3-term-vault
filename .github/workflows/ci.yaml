name: CI

on: [push]

jobs:
  foundry-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge install
      # The Kontrol proofs are excluded here on purpose: they are symbolic and
      # cannot run under `forge test`. They are proved by .github/workflows/kontrol.yaml.
      - name: Run non-Kontrol tests
        run: |
          forge test --no-match-path "src/test/kontrol/*" -vvv
      # That exclusion also catches the one ordinary forge test in the
      # directory: a concrete regression test for a list cycle that the formal
      # verification found. It is not a proof, so it runs here.
      - name: Run Kontrol counterexample regression test
        run: forge test --match-path "src/test/kontrol/Counterexamples.t.sol" -vvv
      - name: Run snapshot without Kontrol tests
        run: forge snapshot --no-match-path "src/test/kontrol/*"
      - name: Run coverage without Kontrol tests
        run: forge coverage --report lcov --no-match-path "src/test/kontrol/*"
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  
